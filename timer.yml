name: Таймер Хроники Акаши

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: akasha-channel-timer
  cancel-in-progress: false

jobs:
  update-countdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить библиотеку изображения
        run: python -m pip install Pillow==12.3.0
      - name: Обновить картинку в закрепе
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PYBOT'
          import base64, hashlib, io, pathlib, runpy, sys, tempfile, zipfile
          payload = base64.b64decode("")
          if hashlib.sha256(payload).hexdigest() != "9d91f5ff33047a939040d87b0e057b68a2127a02c88f3085627dcbc7e0ec7a6d":
              raise RuntimeError("Program bundle is corrupted")
          with tempfile.TemporaryDirectory(prefix="akasha-") as directory:
              root = pathlib.Path(directory)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  for item in archive.infolist():
                      path = pathlib.PurePosixPath(item.filename)
                      if path.is_absolute() or ".." in path.parts:
                          raise RuntimeError("Unsafe bundle path")
                  archive.extractall(root)
              sys.path.insert(0, str(root))
              runpy.run_path(str(root / "github_tick.py"), run_name="__main__")
          PYBOT
